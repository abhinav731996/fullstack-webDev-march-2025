<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
    <style>
        form{
            position: fixed;
            top: 50%;
            left: 50%;
            translate: -50%;
            padding: 20px;
            background: #fff;
            border: 1px solid #e0e0e0;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, .15);
            display: none;

        }
        form.show{
            display: block;
            opacity: 0;
            animation: fadeIn .6s forwards;
        }
        @keyframes fadeIn{
            to{opacity: 1;}
        }
    </style>
</head>
<body>
    <header>
        <h1>Promise</h1>
    </header>
    <main>
        <form action="#">
            <div>
                <label for="">name</label>
                <input type="text" name="" id="">
            </div>
            <input type="submit" name="" id="">
        </form>
    </main>
    <script src="./script.js"></script>
</body>
</html>
