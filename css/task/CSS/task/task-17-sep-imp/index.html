<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="d-flex">
        <header>&nbsp;</header>
        <section class="sidebar">&nbsp;</section>
        <section class="main">
            <section class="hero border rounded">&nbsp;</section>
            <section class="section-2 d-flex ">
                <div class="left-panel">
                    <div class="panel-top d-flex border rounded">
                        <div class="box rounded bg-gray border">&nbsp;</div>
                        <div class="box rounded bg-gray border">&nbsp;</div> 
                        <div class="box rounded bg-gray border">&nbsp;</div>
                    </div>
                    <div class="bottom-panel align-center d-flex border rounded">
                        <div class="box rounded bg-gray border">&nbsp;</div>
                        <div class="box rounded bg-gray border">&nbsp;</div>
                    </div>
                </div>
                <div class="border rounded  border-wrapper d-flex flex-column">
                    <div class="box bg-gray ">&nbsp;</div>
                    <div class="box ">&nbsp;</div>
                </div>
            </section>
            <section class="section-3 border rounded d-flex bg-gray justify-cente align-center">
                 <div class="box bg-gray rounded border">&nbsp; </div>
                 <div class="box bg-gray border-wrapper border d-flex rounded flex-column">
                    <div class="box bg-gray rounded">&nbsp;</div>
                    <div class="box bg-white">&nbsp;</div>
                 </div>
                 <div class="box bg-gray rounded border">&nbsp;</div>
                 <div class="box bg-gray rounded border">&nbsp;</div>
                 <div class="box bg-white rounded border">&nbsp;</div>
            </section>
        </section>
    </main>
</body>
</html>
